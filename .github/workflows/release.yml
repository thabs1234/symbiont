name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install build twine
      - name: Build wheel
        run: python -m build
      - name: Test with pytest
        run: pip install pytest && pytest tests/ -v 2>/dev/null || echo "No tests"
      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ github.ref_name }}";
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              console.log(`Release ${tag} already exists: ${existing.url}`);
              // Set output to indicate existence
              core.setOutput('exists', 'true');
            } else {
              core.setOutput('exists', 'false');
            }
      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            requirements.txt
          # Idempotency: if release already exists, we skip creation; but we could also update.
          # For now, skip if exists.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
