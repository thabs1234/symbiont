name: Scheduled Scrapers

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 6am UTC
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:       # Manual trigger

jobs:
  youtube-tiktok-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install yt-dlp and deps
      run: |
        pip install yt-dlp ffmpeg-python aiohttp

    - name: Run YouTube scrape
      if: github.event.schedule == '0 6 * * *'
      env:
        YT_API_KEY: ${{ secrets.YT_API_KEY }}
      run: |
        python -m yt_dlp --version
        echo "YouTube scrape placeholder - replace with your script"

    - name: Run TikTok scrape
      if: github.event.schedule == '0 */6 * * *'
      env:
        TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
      run: |
        echo "TikTok scrape placeholder - replace with your script"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scrape-output-${{ github.run_id }}
        path: |
          *.json
          *.csv
          *.txt
        retention-days: 7

  whatsapp-bot-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Health check WhatsApp bridge
      run: |
        curl -f http://localhost:3000/health 2>/dev/null || echo "Bridge not running in CI (expected)"
        echo "WhatsApp bot health placeholder"